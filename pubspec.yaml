name: graduation_app
description: A Flutter app using MVVM with BLoC, EasyLocalization, theming, and
  reusable components.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  agora_rtc_engine: ^6.5.3
  cloud_firestore: ^6.0.3
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  equatable: ^2.0.7
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_sound: ^9.28.0
  flutter_tts: ^4.2.5
  google_sign_in: ^6.2.1
  http: ^1.5.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
  whisper_ggml: ^1.7.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
  #   - assets/icons/
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
flutter_assets:
  assets_path: assets/
  output_path: lib/core/utils/
  filename: assets.dart